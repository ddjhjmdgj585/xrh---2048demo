<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
  :root {
    --size: 5;            /* grid dimension (5x5 only) */
    --cell: 100px;
    --gap: 12px;
    --pad: 16px;
    --step: 112px;        /* cell + gap */
    --grid: 468px;        /* outer board size */
    --font-main: 'Segoe UI', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: var(--font-main);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    background: linear-gradient(135deg, #d4f1f4 0%, #a2d5c6 50%, #7ec8c8 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: #004d40;
  }

  .container {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 24px;
    max-width: 1200px;
    width: 100%;
  }

  .wrap {
    width: var(--grid);
    max-width: 95vw;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ===== Right sidebar ===== */
  .sidebar {
    width: 220px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex-shrink: 0;
  }
  .side-card {
    background: rgba(255, 255, 255, 0.7);
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 4px 14px rgba(0, 77, 64, 0.15);
    backdrop-filter: blur(6px);
  }
  .side-card h3 {
    font-size: 16px;
    font-weight: 800;
    color: #006974;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .coins-card {
    background: linear-gradient(135deg, #ffb74d, #f57c00);
    color: #fff;
    text-align: center;
  }
  .coins-card h3 { color: #fff; }
  .coins-card .coin-big {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 1px;
  }

  .action-card {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.15s;
    border: 2px solid transparent;
  }
  .action-card:hover {
    transform: translateX(2px);
    border-color: rgba(38, 198, 218, 0.5);
    box-shadow: 0 6px 18px rgba(0, 77, 64, 0.2);
  }
  .action-icon {
    font-size: 28px;
  }
  .action-text { flex: 1; }
  .action-title {
    font-size: 15px;
    font-weight: 800;
    color: #004d40;
  }
  .action-sub {
    font-size: 11px;
    color: #00696a;
    margin-top: 2px;
  }

  .active-curses-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 28px;
  }
  .active-curses-bar .ac-chip {
    background: rgba(239, 83, 80, 0.9);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 4px;
    animation: chip-in 0.3s ease;
  }
  @keyframes chip-in {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  /* ===== Panel modal ===== */
  .panel-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 400;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .panel-mask.show {
    opacity: 1;
    pointer-events: auto;
  }
  .panel {
    background: linear-gradient(135deg, #e0f7fa, #b2ebf2);
    border-radius: 20px;
    width: 420px;
    max-width: 92vw;
    max-height: 80vh;
    display: none;
    flex-direction: column;
    box-shadow: 0 14px 42px rgba(0, 77, 64, 0.4);
    border: 2px solid rgba(0, 150, 136, 0.3);
    transform: scale(0.85);
    transition: transform 0.25s ease;
    overflow: hidden;
  }
  .panel-mask.show .panel {
    transform: scale(1);
  }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: linear-gradient(135deg, #00897b, #00695c);
    color: #fff;
  }
  .panel-header h2 {
    font-size: 20px;
    font-weight: 800;
    margin: 0;
  }
  .panel-close {
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    font-size: 20px;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .panel-close:hover { background: rgba(255,255,255,0.35); }
  .panel-body {
    padding: 16px 20px;
    overflow-y: auto;
    flex: 1;
  }
  .panel-coins {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    color: #006974;
    margin-bottom: 12px;
  }
  .panel-coins span { color: #ef6c00; font-size: 16px; }

  .shop-list, .curse-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .shop-item, .curse-item {
    background: rgba(255, 255, 255, 0.5);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    border: 2px solid transparent;
    font-family: var(--font-main);
    text-align: left;
    width: 100%;
  }
  .shop-item:hover:not(.disabled), .curse-item:hover:not(.disabled) {
    background: rgba(38, 198, 218, 0.2);
    border-color: rgba(38, 198, 218, 0.5);
    transform: translateX(2px);
  }
  .shop-item.disabled, .curse-item.disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .curse-item.active {
    background: rgba(239, 83, 80, 0.2);
    border-color: rgba(239, 83, 80, 0.6);
  }
  .shop-item .item-icon, .curse-item .item-icon {
    font-size: 22px;
    width: 32px;
    text-align: center;
    flex-shrink: 0;
  }
  .shop-item .item-info, .curse-item .item-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
  }
  .shop-item .item-name, .curse-item .item-name {
    font-size: 13px;
    font-weight: 700;
    color: #004d40;
  }
  .shop-item .item-desc, .curse-item .item-desc {
    font-size: 11px;
    color: #00696a;
    line-height: 1.3;
  }
  .shop-item .item-price {
    background: linear-gradient(135deg, #ffb74d, #f57c00);
    color: #fff;
    border-radius: 8px;
    padding: 3px 8px;
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .curse-item .item-status {
    font-size: 11px;
    font-weight: 700;
    color: #c62828;
    white-space: nowrap;
  }

  .curse-info {
    font-size: 11px;
    color: #00696a;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed rgba(0, 105, 106, 0.3);
    line-height: 1.4;
  }
  .curse-info .progress {
    font-weight: 800;
    color: #c62828;
  }

  /* ===== Curse warning modal ===== */
  .curse-warning {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .curse-warning.show { opacity: 1; }
  .cw-box {
    background: linear-gradient(135deg, #fff3e0, #ffe0b2);
    border-radius: 18px;
    padding: 28px 32px;
    text-align: center;
    max-width: 340px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.35);
    border: 3px solid #ef5350;
    transform: scale(0.8);
    transition: transform 0.25s ease;
  }
  .curse-warning.show .cw-box { transform: scale(1); }
  .cw-icon { font-size: 56px; margin-bottom: 8px; }
  .cw-title {
    font-size: 22px;
    font-weight: 900;
    color: #c62828;
    margin-bottom: 10px;
  }
  .cw-text {
    font-size: 14px;
    color: #37474f;
    line-height: 1.7;
    margin-bottom: 20px;
  }
  .cw-text b { color: #c62828; }
  .cw-btns {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  .cw-btn {
    font-family: var(--font-main);
    border: none;
    border-radius: 10px;
    padding: 10px 22px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.15s;
  }
  .cw-btn:hover { transform: translateY(-2px); }
  .cw-cancel {
    background: #eceff1;
    color: #37474f;
  }
  .cw-confirm {
    background: linear-gradient(135deg, #ef5350, #c62828);
    color: #fff;
    box-shadow: 0 4px 12px rgba(239, 83, 80, 0.4);
  }

  /* ===== Frozen tile ===== */
  .tile.frozen {
    box-shadow: 0 0 0 3px #29b6f6, 0 0 18px rgba(41, 182, 246, 0.5);
    filter: brightness(0.85) saturate(0.7);
    animation: frozen-pulse 2s infinite ease-in-out;
  }
  @keyframes frozen-pulse {
    0%, 100% { box-shadow: 0 0 0 3px #29b6f6, 0 0 14px rgba(41, 182, 246, 0.4); }
    50% { box-shadow: 0 0 0 3px #81d4fa, 0 0 24px rgba(41, 182, 246, 0.7); }
  }

  /* ===== Crystal ball hint ===== */
  .crystal-hint {
    position: absolute;
    background: rgba(186, 104, 200, 0.35);
    border-radius: 10px;
    border: 2px dashed #ab47bc;
    animation: crystal-pulse 1s infinite ease-in-out;
    pointer-events: none;
    z-index: 5;
  }
  @keyframes crystal-pulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 1; transform: scale(0.92); }
  }

  /* ===== Title + Scores ===== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .title {
    font-size: 48px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #006064;
    text-shadow: 0 2px 0 rgba(255,255,255,0.4);
  }

  .scores {
    display: flex;
    gap: 10px;
  }

  .score-box {
    background: linear-gradient(135deg, #0097a7, #006974);
    color: #fff;
    border-radius: 12px;
    padding: 8px 16px;
    min-width: 90px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0, 96, 100, 0.25);
  }

  .score-box .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.85;
  }

  .score-box .value {
    font-size: 24px;
    font-weight: 800;
    line-height: 1.1;
  }

  .score-box .value.bump {
    animation: bump 0.3s ease;
  }

  @keyframes bump {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.18); color: #b2ebf2; }
    100% { transform: scale(1); }
  }

  /* moves counter — accent gradient to distinguish from scores */
  .score-box.moves {
    background: linear-gradient(135deg, #26c6da, #00acc1);
    box-shadow: 0 4px 10px rgba(0, 172, 193, 0.3);
  }

  /* ranking panel inside overlay */
  .ranking {
    width: 100%;
    max-width: 380px;
    max-height: 230px;
    overflow-y: auto;
    background: rgba(0, 0, 0, 0.25);
    border-radius: 10px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .ranking::-webkit-scrollbar { width: 6px; }
  .ranking::-webkit-scrollbar-thumb {
    background: rgba(178, 235, 242, 0.4);
    border-radius: 3px;
  }
  .rank-item {
    display: grid;
    grid-template-columns: 28px 1fr 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 14px;
    background: rgba(255, 255, 255, 0.08);
  }
  .rank-item.cur {
    background: linear-gradient(135deg, rgba(38, 198, 218, 0.6), rgba(0, 172, 193, 0.6));
    box-shadow: inset 0 0 0 1px rgba(178, 235, 242, 0.7);
  }
  .rank-item .rk-no { font-weight: 800; color: #b2ebf2; text-align: center; }
  .rank-item .rk-moves { font-weight: 700; }
  .rank-item .rk-date { opacity: 0.75; font-size: 12px; }
  .rank-empty { text-align: center; opacity: 0.8; padding: 18px; font-size: 14px; }

  /* ===== Sub bar ===== */
  .subbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
    color: #00696a;
  }

  .hint { opacity: 0.85; line-height: 1.4; }

  .btn {
    background: linear-gradient(135deg, #26c6da, #00acc1);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 9px 18px;
    font-size: 14px;
    font-weight: 700;
    font-family: var(--font-main);
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 172, 193, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(0,172,193,0.45); }
  .btn:active { transform: translateY(1px); box-shadow: 0 3px 8px rgba(0,172,193,0.4); }

  /* ===== Grid ===== */
  .game {
    position: relative;
    width: var(--grid);
    height: var(--grid);
    background: linear-gradient(135deg, #009688, #00838f);
    border-radius: 18px;
    padding: var(--pad);
    box-shadow:
      0 10px 30px rgba(0, 77, 64, 0.35),
      inset 0 2px 6px rgba(255, 255, 255, 0.15);
  }

  .grid-bg {
    position: absolute;
    inset: var(--pad);
    display: grid;
    grid-template-columns: repeat(var(--size), var(--cell));
    grid-template-rows: repeat(var(--size), var(--cell));
    gap: var(--gap);
  }

  .cell {
    background: rgba(255, 255, 255, 0.22);
    border-radius: 10px;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06);
  }

  .tile-layer {
    position: absolute;
    inset: var(--pad);
    width: var(--grid-inner);
    height: var(--grid-inner);
  }

  .tile {
    position: absolute;
    top: 0;
    left: 0;
    width: var(--cell);
    height: var(--cell);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 42px;
    transition: transform 0.15s ease-out;
    will-change: transform;
    box-shadow: 0 3px 8px rgba(0, 77, 64, 0.18);
  }

  /* number size shrink for big values */
  .tile.s4 { font-size: 38px; }
  .tile.s5 { font-size: 32px; }
  .tile.s6 { font-size: 26px; }

  /* tile color palette — fresh blue/green/cyan */
  .tile.v2    { background: #e0f7fa; color: #006064; }
  .tile.v4    { background: #b2ebf2; color: #006064; }
  .tile.v8    { background: #80deea; color: #004d40; }
  .tile.v16   { background: #4dd0e1; color: #004d40; }
  .tile.v32   { background: #26c6da; color: #ffffff; }
  .tile.v64   { background: #00bcd4; color: #ffffff; }
  .tile.v128  { background: #00acc1; color: #ffffff; box-shadow: 0 3px 12px rgba(0,172,193,0.45); }
  .tile.v256  { background: #0097a7; color: #ffffff; box-shadow: 0 3px 12px rgba(0,151,167,0.5); }
  .tile.v512  { background: #00838f; color: #ffffff; box-shadow: 0 3px 14px rgba(0,131,143,0.55); }
  .tile.v1024 { background: #006974; color: #ffffff; box-shadow: 0 3px 16px rgba(0,105,116,0.6); }
  .tile.v2048 { background: linear-gradient(135deg, #004d40, #00695c); color: #fff; box-shadow: 0 0 22px rgba(0, 230, 118, 0.6); }
  .tile.vbig  { background: linear-gradient(135deg, #003d33, #004d40); color: #80cbc4; box-shadow: 0 0 26px rgba(0, 230, 118, 0.7); }

  /* animations */
  .tile.new {
    animation: appear 0.18s ease-out;
  }
  @keyframes appear {
    0%   { transform: var(--pos) scale(0); opacity: 0; }
    60%  { transform: var(--pos) scale(1.12); opacity: 1; }
    100% { transform: var(--pos) scale(1); }
  }

  .tile.pop {
    animation: pop 0.18s ease-out;
  }
  @keyframes pop {
    0%   { transform: var(--pos) scale(1); }
    45%  { transform: var(--pos) scale(1.22); }
    100% { transform: var(--pos) scale(1); }
  }

  /* overlays */
  .overlay {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(0, 77, 64, 0.82);
    color: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 30;
    backdrop-filter: blur(3px);
  }
  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .overlay h2 {
    font-size: 46px;
    font-weight: 800;
    letter-spacing: 2px;
    text-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }
  .overlay p { font-size: 16px; opacity: 0.9; }
  .overlay .btn { background: linear-gradient(135deg, #26c6da, #00acc1); }

  /* ===== Main menu ===== */
  .menu {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: linear-gradient(135deg, rgba(0, 77, 64, 0.92), rgba(0, 105, 116, 0.92));
    color: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 20;
    backdrop-filter: blur(3px);
  }
  .menu.show { opacity: 1; pointer-events: auto; }
  .menu .m-title {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: 4px;
    text-shadow: 0 3px 0 rgba(0,0,0,0.25), 0 0 24px rgba(38, 198, 218, 0.5);
  }
  .menu .m-sub { font-size: 14px; opacity: 0.85; margin-top: -10px; }
  .menu .m-btns { display: flex; flex-direction: column; gap: 10px; width: 60%; min-width: 180px; }
  .menu .m-btns .btn { width: 100%; padding: 12px; font-size: 16px; }
  .menu .m-tip { font-size: 12px; opacity: 0.7; margin-top: 4px; }

  /* size toggle group */
  .size-toggle {
    display: inline-flex;
    background: rgba(0, 0, 0, 0.25);
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
  }
  .size-toggle button {
    background: transparent;
    color: #b2ebf2;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 700;
    font-family: var(--font-main);
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .size-toggle button.active {
    background: linear-gradient(135deg, #26c6da, #00acc1);
    color: #fff;
    box-shadow: 0 2px 6px rgba(0, 172, 193, 0.4);
  }
  .menu .m-label { font-size: 12px; opacity: 0.7; letter-spacing: 1px; text-transform: uppercase; }

  /* subbar variant: dark toggle on light background */
  .subbar .size-toggle { background: rgba(0, 96, 100, 0.15); }
  .subbar .size-toggle button { color: #006974; }
  .subbar .size-toggle button.active { color: #fff; }

  /* ===== Pause mask ===== */
  .pause-mask {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(0, 77, 64, 0.7);
    color: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 15;
    backdrop-filter: blur(4px);
  }
  .pause-mask.show { opacity: 1; pointer-events: auto; }
  .pause-mask h2 { font-size: 40px; font-weight: 800; letter-spacing: 2px; }
  .pause-mask p { font-size: 13px; opacity: 0.85; }

  /* ===== FX layer (particles canvas) ===== */
  .fx-layer {
    position: absolute;
    inset: var(--pad);
    pointer-events: none;
    z-index: 6;
    border-radius: 10px;
  }

  /* ===== Screen shake & flash ===== */
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-3px, 2px); }
    40% { transform: translate(3px, -2px); }
    60% { transform: translate(-2px, -3px); }
    80% { transform: translate(2px, 3px); }
  }
  @keyframes shake-strong {
    0%, 100% { transform: translate(0, 0); }
    10% { transform: translate(-6px, 4px); }
    25% { transform: translate(6px, -4px); }
    40% { transform: translate(-5px, -5px); }
    55% { transform: translate(5px, 5px); }
    70% { transform: translate(-4px, 3px); }
    85% { transform: translate(4px, -3px); }
  }
  .game.shake { animation: shake 0.25s ease; }
  .game.shake-strong { animation: shake-strong 0.4s ease; }
  .game.flash::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: radial-gradient(circle, rgba(178, 235, 242, 0.7), transparent 70%);
    pointer-events: none;
    animation: flash 0.5s ease-out;
    z-index: 25;
  }
  @keyframes flash {
    0% { opacity: 0; }
    30% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ===== Combo popup ===== */
  .combo-popup {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -40%) scale(0.6);
    font-size: 28px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 2px 10px rgba(0, 77, 64, 0.6);
    pointer-events: none;
    opacity: 0;
    z-index: 15;
    white-space: nowrap;
    letter-spacing: 1px;
  }
  .combo-popup.show {
    animation: combo-pop 1.1s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  }
  @keyframes combo-pop {
    0%   { opacity: 0; transform: translate(-50%, -20%) scale(0.6); }
    20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    40%  { transform: translate(-50%, -45%) scale(1); }
    70%  { opacity: 1; transform: translate(-50%, -55%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -70%) scale(0.9); }
  }

  /* ===== Stage bar ===== */
  .stage-card {
    text-align: center;
    padding: 10px 14px;
  }
  .stage-label {
    font-size: 13px;
    font-weight: 800;
    color: #004d40;
    margin-bottom: 8px;
  }
  .stage-bar {
    display: flex;
    gap: 4px;
    justify-content: center;
  }
  .stage-seg {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.15);
    color: #555;
    font-size: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }
  .stage-seg.done {
    background: linear-gradient(135deg, #4caf50, #2e7d32);
    color: #fff;
  }
  .stage-seg.active {
    background: linear-gradient(135deg, #00897b, #00695c);
    color: #fff;
    transform: scale(1.2);
    box-shadow: 0 2px 8px rgba(0, 137, 123, 0.5);
  }

  /* ===== Strategy pick cards ===== */
  .strat-box {
    max-width: 600px;
    border-color: #00897b;
  }
  .strat-cards {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin: 16px 0;
  }
  .strat-card {
    background: linear-gradient(135deg, #e0f7fa, #b2ebf2);
    border: 2px solid rgba(0, 150, 136, 0.4);
    border-radius: 14px;
    padding: 16px 14px;
    width: 160px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  }
  .strat-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0, 150, 136, 0.35);
    border-color: #00897b;
  }
  .strat-icon {
    font-size: 36px;
    margin-bottom: 8px;
  }
  .strat-name {
    font-size: 16px;
    font-weight: 800;
    color: #004d40;
    margin-bottom: 6px;
  }
  .strat-desc {
    font-size: 11px;
    color: #00696a;
    line-height: 1.4;
  }

  /* unremovable curse chip */
  .ac-chip.unremovable {
    background: rgba(198, 40, 40, 0.9);
    border: 1px solid #fff;
  }

  /* ===== Coin popup ===== */
  .coin-popup {
    position: absolute;
    font-size: 18px;
    font-weight: 800;
    color: #ffd54f;
    text-shadow: 0 2px 6px rgba(0, 77, 64, 0.7), 0 0 8px rgba(255, 213, 79, 0.5);
    pointer-events: none;
    z-index: 16;
    animation: coin-float 0.9s ease-out forwards;
    white-space: nowrap;
  }
  @keyframes coin-float {
    0%   { opacity: 0; transform: translateY(0) scale(0.6); }
    20%  { opacity: 1; transform: translateY(-8px) scale(1.1); }
    100% { opacity: 0; transform: translateY(-32px) scale(0.9); }
  }

  /* ===== Obstacle tile ===== */
  .tile.obstacle {
    background: linear-gradient(135deg, #546e7a, #37474f);
    color: #b0bec5;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4), inset 0 2px 4px rgba(255,255,255,0.1);
    font-size: 22px;
  }
  .tile.obstacle::after {
    content: '✦';
    font-size: 28px;
    color: #78909c;
  }
  .tile.obstacle.cracking {
    animation: crack 0.4s ease-out;
  }
  @keyframes crack {
    0%   { transform: var(--pos) scale(1); filter: brightness(1); }
    40%  { transform: var(--pos) scale(1.3); filter: brightness(2); }
    100% { transform: var(--pos) scale(0); filter: brightness(0.5); opacity: 0; }
  }

  /* ===== Curse indicator ===== */
  .curse-bar {
    position: absolute;
    bottom: -6px;
    left: 0;
    right: 0;
    height: 4px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 2px;
    overflow: hidden;
    z-index: 5;
  }
  .curse-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff7043, #ffca28);
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .curse-label {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 700;
    color: #ff7043;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    white-space: nowrap;
    z-index: 5;
  }

  /* ===== Bomb mode ===== */
  .game.bomb-mode .tile:not(.obstacle) {
    cursor: crosshair;
    animation: bomb-pulse 0.6s ease-in-out infinite;
  }
  @keyframes bomb-pulse {
    0%, 100% { box-shadow: 0 3px 8px rgba(0, 77, 64, 0.18); }
    50% { box-shadow: 0 3px 18px rgba(255, 87, 34, 0.7); }
  }
  .bomb-hint {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(198, 40, 40, 0.9);
    color: #fff;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    z-index: 40;
    pointer-events: none;
    animation: bomb-hint-pulse 1s ease-in-out infinite;
  }
  @keyframes bomb-hint-pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -52%) scale(1.03); }
  }

  /* responsive scaling on small screens (size-dependent vars set by JS) */
  @media (max-width: 520px) {
    .container {
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .sidebar {
      width: var(--grid);
      max-width: 95vw;
      flex-direction: row;
      flex-wrap: wrap;
    }
    .side-card {
      flex: 1;
      min-width: 140px;
    }
    .action-card {
      flex: 1;
      min-width: 130px;
    }
    .coins-card {
      flex: 0 0 100%;
    }
    .title { font-size: 36px; }
    .tile { font-size: 32px; }
    .tile.s4 { font-size: 28px; }
    .tile.s5 { font-size: 24px; }
    .tile.s6 { font-size: 20px; }
    .scores { gap: 6px; }
    .score-box { min-width: 62px; padding: 6px 10px; }
    .score-box .label { font-size: 10px; }
    .score-box .value { font-size: 18px; }
  }
</style>
</head>
<body>
  <div class="container">

  <div class="panel-mask" id="panelMask">

        <h2>🛒 商店</h2>

<script>
(function () {
  'use strict';

  const MOVE_MS = 150;   // match CSS transition duration
  const POP_MS = 180;    // match pop animation
  const STATE = { MENU: 'menu', PLAYING: 'playing', PAUSED: 'paused', WON: 'won', OVER: 'over' };

  // supported board sizes & their target tile to win
  const SIZES = [5];
  const WIN_TILE = { 5: 4096 };   // 5x5 board goal

  // read CSS variables for sizing (keeps JS in sync with responsive CSS)
  const cssVar = (name) => {
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return parseFloat(v);
  };
  const step = () => cssVar('--step');

  const VECTORS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1  },
    left:  { x: -1, y: 0  },
    right: { x: 1,  y: 0  }
  };

  // DOM refs
  const tileLayer = document.getElementById('tileLayer');
  const gridBg = document.getElementById('gridBg');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const rankingEl = document.getElementById('ranking');
  const movesEl = document.getElementById('moves');
  const fxLayer = document.getElementById('fxLayer');
  const fxCtx = fxLayer.getContext('2d');
  const mainMenu = document.getElementById('mainMenu');
  const pauseMask = document.getElementById('pauseMask');
  const gameEl = document.getElementById('game');

  // build background cells (rebuilt when board size changes)
  function buildCells() {
    gridBg.innerHTML = '';
    for (let i = 0; i < size * size; i++) {
      const c = document.createElement('div');
      c.className = 'cell';
      gridBg.appendChild(c);
    }
  }

  // pick layout params for a given board size & viewport, set CSS vars
  const LAYOUT = {
    5: { desk: { cell: 80,  gap: 10, pad: 14 }, mob: { cell: 60, gap: 8,  pad: 10 } }
  };

  function applySize() {
    const mobile = window.innerWidth <= 520;
    const p = (LAYOUT[size] || LAYOUT[5])[mobile ? 'mob' : 'desk'];
    const stepVal = p.cell + p.gap;
    const gridInner = p.cell * size + p.gap * (size - 1);
    const grid = p.pad * 2 + gridInner;
    const root = document.documentElement;
    root.style.setProperty('--size', size);
    root.style.setProperty('--cell', p.cell + 'px');
    root.style.setProperty('--gap', p.gap + 'px');
    root.style.setProperty('--pad', p.pad + 'px');
    root.style.setProperty('--step', stepVal + 'px');
    root.style.setProperty('--grid-inner', gridInner + 'px');
    root.style.setProperty('--grid', grid + 'px');
    buildCells();
    resizeFx();
    // reposition existing tiles to new step (skip before first init)
    if (tiles) tiles.forEach(tile => setTilePos(tile));
  }

  // sync size-toggle button active states across both menus
  function syncSizeButtons() {
    document.querySelectorAll('.size-toggle button').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.size, 10) === size);
    });
  }

  // user changed board size via toggle
  function setSize(newSize) {
    if (!SIZES.includes(newSize) || newSize === size) return;
    size = newSize;
    syncSizeButtons();
    applySize();
    // any board change starts a fresh run
    newGame();
    if (mainMenu.classList.contains('show')) {
      // still in menu: stay in menu, just preview the new board
      state = STATE.MENU;
    } else {
      state = STATE.PLAYING;
      audio.resume();
    }
  }

  // state
  let state = STATE.MENU;   // explicit state machine
  let size = 5;        // current board dimension (5x5 only)
  let grid;            // 2D array of tile|null
  let tiles;           // Map<id, tile>
  let idCounter;
  let score;
  let best;
  let moves;           // successful-move counter for current run
  let busy;            // input lock during animation
  let won;             // keep playing after 2048?
  let winShown;
  let pauseTimerEnd = 0;   // timestamp when pause started (for resuming mid-animation)

  // economy & roguelike
  let coins = 0;
  let activeCurses = [];      // permanent curses (random, no reward, no merge-removal)
  let activeChallenges = [];  // voluntary challenges (debuff for coins, has goal)
  let shieldCount = 0;
  let nextCoinMult = 1;
  let undoSnapshot = null;
  let bombMode = false;
  let superBombMode = false;

  // stage system
  let currentStage = 1;
  let stageRewardClaimed = [false, false, false, false, false]; // index 0-4
  let activeStrategies = [];   // active strategy buffs

  // strategy effects (flags)
  let coinBonus = 1;           // 投资嗅觉 multiplier
  let scoreBonus = 1;          // 与狼共舞 multiplier
  let bombDiscount = 1;        // 爆破达人 discount
  let undoDiscount = 1;       // 时间回溯 discount
  let centerSpawn = false;     // 精准生成
  let highSpawn = false;       // 赢在起早线 (spawn 8)
  let comboMasterMult = 1;     // 连击大师 (×1.5 on multi-merge)
  let autoClean = false;       // 大扫除
  let superBombAvail = false;  // 超级炸弹 (one-time use flag)
  let superBombUsed = false;

  const STAGES = [
    { id: 1, name: '开局发育', threshold: 0,      desc: '熟悉棋盘，积累基础' },
    { id: 2, name: '策略选择', threshold: 500,    desc: '获得第一次策略三选一' },
    { id: 3, name: '精英战', threshold: 2000,   desc: '获得一个随机永久诅咒' },
    { id: 4, name: '过渡期', threshold: 5000,   desc: '可在商店花费金币解除诅咒' },
    { id: 5, name: 'BOSS战', threshold: 10000,  desc: '获得不可消除诅咒+进阶策略' }
  ];

  const STRATEGIES_BASIC = {
    invest:    { id: 'invest',    icon: '📈', name: '投资嗅觉', desc: '永久将所有金币获取量提升+30%', rarity: 'basic' },
    wolf:      { id: 'wolf',      icon: '🐺', name: '与狼共舞', desc: '每有一个诅咒，得分效率+25%，可叠加', rarity: 'basic' },
    blaster:   { id: 'blaster',   icon: '💣', name: '爆破达人', desc: '主动道具"炸弹"的价格-30%', rarity: 'basic' },
    rewind:    { id: 'rewind',    icon: '⏰', name: '时间回溯', desc: '主动道具"时钟（撤销）"的价格-30%', rarity: 'basic' },
    tycoon:    { id: 'tycoon',    icon: '💰', name: '财富大亨', desc: '立即获得25金币', rarity: 'basic' },
    foundation:{ id: 'foundation',icon: '🧱', name: '稳固基石', desc: '立即在棋盘空白处生成64方块', rarity: 'basic' }
  };

  const STRATEGIES_ADVANCED = {
    fission:   { id: 'fission',   icon: '🌀', name: '混沌裂变', desc: '将目前得分×150%但棋盘随机打乱一次(不含障碍物)', rarity: 'advanced' },
    superbomb: { id: 'superbomb', icon: '💥', name: '超级炸弹', desc: '选择一行，将该行方块全部清空并转化为等额得分', rarity: 'advanced' },
    precise:   { id: 'precise',   icon: '🎯', name: '精准生成', desc: '生成的新方块必定出现在棋盘中心区域(中央2×2)', rarity: 'advanced' },
    cleanup:   { id: 'cleanup',   icon: '🧹', name: '大扫除', desc: '每合成一个方块，自动消除棋盘上一个最小的孤立数字', rarity: 'advanced' },
    headstart: { id: 'headstart', icon: '🚀', name: '赢在起跑线', desc: '生成的新方块数字提升到8', rarity: 'advanced' },
    combo:     { id: 'combo',     icon: '⚡', name: '连击大师', desc: '一次滑动中若发生多次合并，将此次得分×1.5', rarity: 'advanced' }
  };

  const ITEMS = {
    bomb:    { id: 'bomb',    name: '💣 炸弹',     desc: '消除任意一个方块', price: 12 },
    undo:    { id: 'undo',    name: '⏰ 时钟',     desc: '撤销上一步操作',   price: 8 },
    crystal: { id: 'crystal', name: '🔮 水晶球',   desc: '预览下一个方块位置', price: 5 },
    doubler: { id: 'doubler', name: '✨ 金币倍增', desc: '下次合并金币×3',   price: 6 },
    shield:  { id: 'shield',  name: '🛡️ 护盾',     desc: '免疫一次诅咒惩罚', price: 10 },
    sweep:   { id: 'sweep',   name: '🧹 清扫',     desc: '消除2个最小方块(需>20个方块)', price: 10 }
  };

  // Curses: permanent, random, no coin reward, no merge-removal
  const CURSES = {
    crystal: {
      id: 'crystal', icon: '💀', name: '水晶诅咒',
      desc: '每8步随机生成一个障碍物',
      onActivate: () => {},
      onMove: (ac) => {
        ac.stepCount = (ac.stepCount || 0) + 1;
        if (ac.stepCount % 8 === 0) {
          const empties = [];
          for (let r = 0; r < size; r++)
            for (let c = 0; c < size; c++)
              if (!grid[r][c]) empties.push({ r, c });
          if (empties.length) {
            const { r, c } = empties[Math.floor(Math.random() * empties.length)];
            createObstacle(r, c);
          }
        }
      }
    },
    time: {
      id: 'time', icon: '⏳', name: '时限诅咒',
      desc: '每15步扣5金币(可被护盾抵消)',
      onActivate: () => {},
      onMove: (ac) => {
        ac.stepCount = (ac.stepCount || 0) + 1;
        if (ac.stepCount % 15 === 0) {
          if (shieldCount > 0) {
            shieldCount--;
            flashMessage('�️ 护盾抵消了时限惩罚!', '#64b5f6');
          } else {
            updateCoins(-5);
            flashMessage('⏳ 时限诅咒: -5🪙', '#ef5350');
          }
        }
      }

  // ===== Audio (WebAudio synthesized, no asset files) =====
  const audio = {
    ctx: null,
    enabled: true,
    resume() {
      if (!this.ctx) {
        try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { this.ctx = null; return; }
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    },
    beep(freq, dur, type, vol) {
      if (!this.enabled || !this.ctx) return;
      const t0 = this.ctx.currentTime;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t0); o.stop(t0 + dur);
    },
    move() { this.beep(180, 0.05, 'square', 0.03); },
    merge(value) {
      // pitch rises with the merged value
      const freq = 220 + Math.log2(value) * 70;
      this.beep(freq, 0.14, 'triangle', 0.08);
    },
    win() {
      [523, 659, 784, 1047].forEach((f, i) =>
        setTimeout(() => this.beep(f, 0.22, 'triangle', 0.1), i * 110));
    },
    over() {
      [330, 277, 220].forEach((f, i) =>
        setTimeout(() => this.beep(f, 0.25, 'sawtooth', 0.07), i * 130));
    },
    combo(count) {
      // rising arpeggio that gets faster & brighter with more merges
      const notes = count >= 5 ? [523, 659, 784, 1047, 1319]
                  : count >= 4 ? [440, 554, 659, 880]
                  : count >= 3 ? [392, 494, 659]
                  : [349, 440];
      const step = Math.max(40, 90 - count * 8);
      notes.forEach((f, i) =>
        setTimeout(() => this.beep(f, 0.12, 'triangle', 0.09), i * step));
    }
  };

  // ===== Particle system (canvas overlay) =====
  const particles = [];
  let rafId = null;

  function resizeFx() {
    const r = fxLayer.getBoundingClientRect();
    fxLayer.width = r.width;
    fxLayer.height = r.height;
  }

  function tileCenterPx(row, col) {
    const s = step();
    return { x: col * s + s / 2, y: row * s + s / 2 };
  }

  function particleColor(value) {
    const map = {
      4: '#b2ebf2', 8: '#80deea', 16: '#4dd0e1', 32: '#26c6da',
      64: '#00bcd4', 128: '#00acc1', 256: '#0097a7', 512: '#00838f',
      1024: '#006974', 2048: '#26ffe6'
    };
    return map[value] || '#80deea';
  }

  function spawnParticles(row, col, value, extra) {
    const { x, y } = tileCenterPx(row, col);
    const count = Math.min(28, 4 + Math.floor(Math.log2(value)) + (extra || 0));
    const color = particleColor(value);
    const power = Math.log2(value);
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2 + Math.random() * 0.4;
      const speed = 1.2 + Math.random() * (1.5 + power * 0.15);
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.02 + Math.random() * 0.02,
        size: 2.5 + Math.random() * (2 + power * 0.2),
        color
      });
    }
    if (!rafId) rafId = requestAnimationFrame(tickFx);
  }

  function tickFx() {
    fxCtx.clearRect(0, 0, fxLayer.width, fxLayer.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08;          // gravity
      p.vx *= 0.98;
      p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      fxCtx.globalAlpha = Math.max(0, p.life);
      fxCtx.fillStyle = p.color;
      fxCtx.beginPath();
      fxCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      fxCtx.fill();
    }
    fxCtx.globalAlpha = 1;
    if (particles.length) {
      rafId = requestAnimationFrame(tickFx);
    } else {
      rafId = null;
    }
  }

  // ===== Stage / Strategy / Curse / Challenge system =====

  // -- Stage progression: check if score crossed a new threshold --
  function checkStageProgress() {
    for (let i = STAGES.length - 1; i >= 0; i--) {
      if (score >= STAGES[i].threshold) {
        if (currentStage < STAGES[i].id) {
          currentStage = STAGES[i].id;
          onStageEnter(currentStage);
        }
        break;
      }
    }
    renderStageBar();

  function onStageEnter(stageId) {
    const stage = STAGES[stageId - 1];
    if (stageId === 2) {
      // basic strategy pick
      showStrategyPick('basic');
    } else if (stageId === 3) {
      // random permanent curse
      const avail = Object.keys(CURSES).filter(id =>
        !activeCurses.find(ac => ac.id === id)
      );
      if (avail.length) {
        const id = avail[Math.floor(Math.random() * avail.length)];
        applyRandomCurse(id, false); // removable via shop
      }
    } else if (stageId === 4) {
      flashMessage('过渡期: 可在商店花费金币解除诅咒', '#26c6da');
    } else if (stageId === 5) {
      // unremovable curse + advanced strategy
      const avail = Object.keys(CURSES).filter(id =>
        !activeCurses.find(ac => ac.id === id)
      );
      if (avail.length) {
        const id = avail[Math.floor(Math.random() * avail.length)];
        applyRandomCurse(id, true); // unremovable
      }
      showStrategyPick('advanced');
    }
    flashMessage(`阶段${stageId}: ${stage.name}`, '#00897b');
  }

  function applyRandomCurse(id, unremovable) {
    const curse = CURSES[id];
    if (!curse) return;
    curse.onActivate();
    activeCurses.push({ id, stepCount: 0, unremovable });
    renderCurseList();
    renderChallengeList();
    flashMessage(`${curse.icon} ${curse.name} 降临!${unremovable ? ' (不可消除)' : ''}`, '#ef5350');

  // -- Process curses per move --
  function advanceCurses() {
    activeCurses.forEach(ac => {
      const curse = CURSES[ac.id];
      if (curse && curse.onMove) curse.onMove(ac);
