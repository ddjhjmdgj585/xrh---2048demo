  // -- Strategy pick: 3 random from pool --
  function showStrategyPick(rarity) {
    const pool = rarity === 'basic' ? STRATEGIES_BASIC : STRATEGIES_ADVANCED;
    const avail = Object.values(pool).filter(s =>
      !activeStrategies.find(as => as.id === s.id)
    );
    const picks = [];
    const tempPool = [...avail];
    for (let i = 0; i < 3 && tempPool.length; i++) {
      const idx = Math.floor(Math.random() * tempPool.length);
      picks.push(tempPool.splice(idx, 1)[0]);
    }
    if (!picks.length) return;

    const mask = document.createElement('div');
    mask.className = 'curse-warning';
    const cardsHtml = picks.map(s => `
      <div class="strat-card" data-id="${s.id}">
        <div class="strat-icon">${s.icon}</div>
        <div class="strat-name">${s.name}</div>
        <div class="strat-desc">${s.desc}</div>
      </div>
    `).join('');
    mask.innerHTML = `
      <div class="cw-box strat-box">
        <div class="cw-title">${rarity === 'basic' ? '基础策略' : '进阶策略'} — 三选一</div>
        <div class="strat-cards">${cardsHtml}</div>
        <div class="cw-text">选择一个策略强化你的本局能力</div>
      </div>
    `;
    document.body.appendChild(mask);
    mask.classList.add('show');

    mask.querySelectorAll('.strat-card').forEach(card => {
      card.onclick = () => {
        const sid = card.dataset.id;
        applyStrategy(sid);
        mask.remove();
      };
    });
    audio.beep(440, 0.15, 'triangle', 0.1);
  }

  function applyStrategy(id) {
    activeStrategies.push({ id });
    const s = (STRATEGIES_BASIC[id] || STRATEGIES_ADVANCED[id]);
    if (!s) return;

    switch (id) {
      case 'invest': coinBonus = 1.3; break;
      case 'wolf': recalcScoreBonus(); break;
      case 'blaster': bombDiscount = 0.7; break;
      case 'rewind': undoDiscount = 0.7; break;
      case 'tycoon': updateCoins(25); break;
      case 'foundation': addSpecificTile(64); break;
      case 'fission':
        updateScore(Math.floor(score * 0.5), false);
        shuffleBoard();
        break;
      case 'superbomb': enterSuperBombMode(); break;
      case 'precise': centerSpawn = true; break;
      case 'cleanup': autoClean = true; break;
      case 'headstart': highSpawn = true; break;
      case 'combo': comboMasterMult = 1.5; break;
    }
    flashMessage(`${s.icon} ${s.name} 已激活!`, '#00c853');
    audio.beep(660, 0.2, 'triangle', 0.1);
    renderStageBar();
    renderShop();
    saveGame();
  }

  function recalcScoreBonus() {
    const wolfCount = activeStrategies.filter(s => s.id === 'wolf').length;
    if (wolfCount > 0) {
      scoreBonus = 1 + activeCurses.length * 0.25 * wolfCount;
    }
  }

  function addSpecificTile(value) {
    const empties = [];
    for (let r = 0; r < size; r++)
      for (let c = 0; c < size; c++)
        if (!grid[r][c]) empties.push({ r, c });
    if (empties.length) {
      const { r, c } = empties[Math.floor(Math.random() * empties.length)];
      const tile = createTile(r, c, value, { new: true });
      grid[r][c] = tile;
    }
  }

  function shuffleBoard() {
    const numberTiles = [];
    const obstacleTiles = [];
    tiles.forEach(t => {
      if (t.obstacle) obstacleTiles.push(t);
      else numberTiles.push(t.value);
    });
    // shuffle values
    for (let i = numberTiles.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [numberTiles[i], numberTiles[j]] = [numberTiles[j], numberTiles[i]];
    }
    // find empty cells (excluding obstacles)
    const empties = [];
    for (let r = 0; r < size; r++)
      for (let c = 0; c < size; c++)
        if (!grid[r][c]) empties.push({ r, c });
    // assign shuffled values to empty cells
    let idx = 0;
    for (const val of numberTiles) {
      if (idx >= empties.length) break;
      const { r, c } = empties[idx];
      const tile = createTile(r, c, val, { new: true });
      grid[r][c] = tile;
      idx++;
    }
    flashMessage('🌀 棋盘已打乱!', '#7b1fa2');
  }

  // -- Curse list rendering --
  function renderCurseList() {
    const bar = document.getElementById('activeCursesBar');
    if (bar) {
      bar.innerHTML = '';
      activeCurses.forEach(ac => {
        const c = CURSES[ac.id];
        const chip = document.createElement('div');
        chip.className = 'ac-chip' + (ac.unremovable ? ' unremovable' : '');
        chip.innerHTML = `${c.icon} ${c.name}`;
        chip.title = c.desc + (ac.unremovable ? ' (不可消除)' : '');
        bar.appendChild(chip);
      });
    }
  }

  // -- Challenge list rendering --
  function renderChallengeList() {
    const list = document.getElementById('curseList');
    if (!list) return;
    list.innerHTML = '';

    const countEl = document.getElementById('curseActiveCount');
    if (countEl) countEl.textContent = activeChallenges.length;

    // active challenges
    activeChallenges.forEach(ac => {
      const ch = CHALLENGES[ac.id];
      const pct = Math.min(100, Math.round(ac.progress / ch.goal * 100));
      const remaining = ch.maxMoves ? Math.max(0, ch.maxMoves - ac.moves) : null;
      const div = document.createElement('div');
      div.className = 'curse-item active';
      let extra = `进行中 ${ac.progress}/${ch.goal}`;
      if (remaining !== null) extra += ` (剩${remaining}步)`;
      div.innerHTML = `
        <div class="item-icon">${ch.icon}</div>
        <div class="item-info">
          <div class="item-name">${ch.name}</div>
          <div class="item-desc">${extra} (${pct}%)</div>
        </div>
      `;
      list.appendChild(div);
    });

    // available challenges (can't duplicate active curse type or active challenge)
    const availIds = Object.keys(CHALLENGES).filter(id => {
      if (activeChallenges.find(ac => ac.id === id)) return false;
      if (activeCurses.find(ac => ac.id === id)) return false; // can't be same type as active curse
      return true;
    });
    availIds.forEach(id => {
      const ch = CHALLENGES[id];
      const div = document.createElement('div');
      div.className = 'curse-item';
      div.innerHTML = `
        <div class="item-icon">${ch.icon}</div>
        <div class="item-info">
          <div class="item-name">${ch.name}</div>
          <div class="item-desc">${ch.desc}</div>
        </div>
        <div class="item-status">+${ch.reward}🪙</div>
      `;
      div.onclick = () => activateChallenge(id);
      list.appendChild(div);
    });

    const info = document.getElementById('curseInfo');
    if (info) {
      info.style.display = activeChallenges.length > 0 ? 'block' : 'none';
      if (activeChallenges.length > 0) {
        info.innerHTML = `挑战进行中: <span class="progress">${activeChallenges.length}</span>`;
      }
    }
  }

  function activateChallenge(chId) {
    if (state !== STATE.PLAYING) {
      flashMessage('请先开始游戏', '#ef5350');
      return;
    }
    if (activeChallenges.find(ac => ac.id === chId)) return;
    if (activeCurses.find(ac => ac.id === chId)) {
      flashMessage('已有同类型诅咒,不能选择相同挑战', '#ef5350');
      return;
    }
    const ch = CHALLENGES[chId];
    if (!ch) return;
    ch.onActivate();
    activeChallenges.push({ id: chId, progress: 0, moves: 0, swapAccum: 0 });
    renderChallengeList();
    flashMessage(`${ch.icon} ${ch.name} 已开启!`, '#ff9800');
    audio.beep(220, 0.15, 'sawtooth', 0.08);
    saveGame();
  }

  function addChallengeProgress(mergedValue) {
    activeChallenges.forEach(ac => {
      const ch = CHALLENGES[ac.id];
      if (mergedValue < ch.checkValue) return;
      ac.progress++;
      if (ac.progress >= ch.goal) {
        completeChallenge(ac);
      }
    });
    renderChallengeList();
  }

  function advanceChallengeMoves() {
    const completed = [];
    activeChallenges.forEach(ac => {
      const ch = CHALLENGES[ac.id];
      ac.moves++;
      if (ch.swapEvery) {
        ac.swapAccum++;
        if (ac.swapAccum >= ch.swapEvery) {
          ac.swapAccum = 0;
          swapTwoTiles();
          flashMessage('🔀 混沌交换!', '#7b1fa2');
        }
      }
      if (ch.maxMoves && ac.moves >= ch.maxMoves && ac.progress < ch.goal) {
        failChallenge(ac);
        completed.push(ac);
      }
    });
    if (completed.length) {
      completed.forEach(ac => {
        const idx = activeChallenges.indexOf(ac);
        if (idx !== -1) activeChallenges.splice(idx, 1);
      });
    }
    renderChallengeList();
  }

  function completeChallenge(ac) {
    const ch = CHALLENGES[ac.id];
    ch.onComplete();
    updateCoins(ch.reward);
    const el = document.createElement('div');
    el.className = 'combo-popup';
    el.style.color = '#ffd54f';
    el.textContent = `${ch.name}解除! +${ch.reward}🪙`;
    gameEl.appendChild(el);
    void el.offsetWidth;
    el.classList.add('show');
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 400);
    }, 800);
    audio.beep(880, 0.2, 'triangle', 0.1);
    const idx = activeChallenges.indexOf(ac);
    if (idx !== -1) activeChallenges.splice(idx, 1);
  }

  function failChallenge(ac) {
    const ch = CHALLENGES[ac.id];
    const el = document.createElement('div');
    el.className = 'combo-popup';
    el.style.color = '#ef5350';
    el.textContent = `${ch.name}失败!`;
    gameEl.appendChild(el);
    void el.offsetWidth;
    el.classList.add('show');
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 400);
    }, 800);
    if (ch.onFail) {
      if (shieldCount > 0) {
        shieldCount--;
        flashMessage('🛡️ 护盾抵消了惩罚!', '#64b5f6');
      } else {
        ch.onFail();
      }
    }
    audio.beep(150, 0.3, 'sawtooth', 0.15);
  }

  // -- Stage bar rendering --
  function renderStageBar() {
    const bar = document.getElementById('stageBar');
    if (!bar) return;
    const stages = bar.querySelectorAll('.stage-seg');
    stages.forEach((seg, i) => {
      seg.classList.toggle('active', i + 1 === currentStage);
      seg.classList.toggle('done', i + 1 < currentStage);
    });
    const label = document.getElementById('stageLabel');
    if (label) {
      const stage = STAGES[currentStage - 1];
      label.textContent = `阶段${currentStage}: ${stage.name}`;
    }
  }

  // -- Remove curse via shop (Stage 3 curse only, costs 15 coins) --
  function canRemoveCurse() {
    return currentStage >= 4 && activeCurses.some(ac => !ac.unremovable);
  }
  function shopRemoveCurse() {
    if (coins < 20) {
      flashMessage('金币不足(需要20🪙)', '#ef5350');
      return;
    }
    const removable = activeCurses.filter(ac => !ac.unremovable);
    if (!removable.length) {
      flashMessage('没有可消除的诅咒', '#ef5350');
      return;
    }
    const ac = removable[0];
    updateCoins(-20);
    // undo curse effects: remove obstacles for crystal/freeze
    const curse = CURSES[ac.id];
    if (ac.id === 'crystal' || ac.id === 'freeze') {
      const toRemove = [];
      tiles.forEach(t => { if (t.obstacle) toRemove.push(t); });
      toRemove.forEach(t => {
        t.el.classList.add('cracking');
        setTimeout(() => { t.el.remove(); }, 400);
        grid[t.row][t.col] = null;
      });
      setTimeout(() => {
        for (const [id, t] of tiles) {
          if (t.obstacle) tiles.delete(id);
        }
      }, 400);
    }
    const idx = activeCurses.indexOf(ac);
    if (idx !== -1) activeCurses.splice(idx, 1);
    recalcScoreBonus();
    renderCurseList();
    renderChallengeList();
    renderShop();
    flashMessage(`${curse.icon} ${curse.name} 已解除!`, '#4caf50');
    audio.beep(660, 0.2, 'triangle', 0.1);
    saveGame();
  }

  function swapTwoTiles() {
    const numberTiles = [];
    tiles.forEach(t => {
      if (!t.obstacle && !t.frozen) numberTiles.push(t);
    });
    if (numberTiles.length < 2) return;
    const i = Math.floor(Math.random() * numberTiles.length);
    let j = Math.floor(Math.random() * numberTiles.length);
    if (i === j) j = (j + 1) % numberTiles.length;
    const a = numberTiles[i], b = numberTiles[j];
    const tmpRow = a.row, tmpCol = a.col;
    grid[a.row][a.col] = b;
    grid[b.row][b.col] = a;
    a.row = b.row; a.col = b.col;
    b.row = tmpRow; b.col = tmpCol;
    setTilePos(a);
    setTilePos(b);
    audio.beep(300, 0.1, 'sine', 0.05);
  }

  // ===== Undo system =====
  function saveSnapshot() {
    undoSnapshot = {
      grid: grid.map(row => row.map(cell => cell ? cell.id : null)),
      tiles: new Map([...tiles].map(([id, t]) => [id, {
        id: t.id, row: t.row, col: t.col, value: t.value,
        obstacle: !!t.obstacle, frozen: !!t.frozen
      }])),
      score, moves, idCounter, won, winShown, size,
      coins,
      activeCurses: JSON.parse(JSON.stringify(activeCurses)),
      activeChallenges: JSON.parse(JSON.stringify(activeChallenges)),
      shieldCount,
      nextCoinMult,
      currentStage,
      activeStrategies: JSON.parse(JSON.stringify(activeStrategies))
    };
  }

  function applySnapshot() {
    if (!undoSnapshot) return false;
    const snap = undoSnapshot;
    // remove all current tiles
    tiles.forEach(t => t.el.remove());
    tiles.clear();
    // rebuild tiles
    for (const [id, tdata] of snap.tiles) {
      const el = document.createElement('div');
      const cls = tdata.obstacle ? 'obstacle' : (valueClass(tdata.value) + ' ' + sizeClass(tdata.value));
      el.className = 'tile ' + cls;
      if (!tdata.obstacle) el.textContent = tdata.value;
      if (tdata.frozen) el.classList.add('frozen');
      const tile = {
        id: tdata.id, row: tdata.row, col: tdata.col, value: tdata.value,
        el, obstacle: tdata.obstacle, frozen: !!tdata.frozen,
        mergedThisTurn: false, pop: false, toRemove: false
      };
      el.dataset.id = id;
      setTilePos(tile);
      tileLayer.appendChild(el);
      tiles.set(id, tile);
    }
    // rebuild grid
    grid = Array.from({ length: size }, () => Array(size).fill(null));
    for (const [id, tdata] of snap.tiles) {
      grid[tdata.row][tdata.col] = tiles.get(id);
    }
    score = snap.score;
    moves = snap.moves;
    idCounter = snap.idCounter;
    won = snap.won;
    winShown = snap.winShown;
    coins = snap.coins;
    activeCurses = snap.activeCurses;
    activeChallenges = snap.activeChallenges;
    shieldCount = snap.shieldCount;
    nextCoinMult = snap.nextCoinMult;
    currentStage = snap.currentStage;
    activeStrategies = snap.activeStrategies;
    updateScore(score, false);
    movesEl.textContent = moves;
    updateCoins(0);
    renderCurseList();
    renderChallengeList();
    renderStageBar();
    return true;
  }

  function undo() {
    if (state !== STATE.PLAYING) return;
    if (!applySnapshot()) {
      flashMessage('没有可撤销的操作', '#ef5350');
      return;
    }
    // remove random tile that was added after the undo point
    // (we saved snapshot BEFORE addRandomTile, so just need to remove extras)
    audio.beep(440, 0.15, 'triangle', 0.08);
  }

  // ===== Bomb system =====
  function enterBombMode() {
    if (state !== STATE.PLAYING) return;
    bombMode = true;
    gameEl.classList.add('bomb-mode');
    const hint = document.createElement('div');
    hint.className = 'bomb-hint';
    hint.id = 'bombHint';
    hint.textContent = '💣 点击要消除的方块 (ESC 取消)';
    gameEl.appendChild(hint);
  }

  function enterSuperBombMode() {
    if (state !== STATE.PLAYING) return;
    if (superBombUsed) {
      flashMessage('超级炸弹已使用过', '#ef5350');
      return;
    }
    superBombMode = true;
    gameEl.classList.add('bomb-mode');
    const hint = document.createElement('div');
    hint.className = 'bomb-hint';
    hint.id = 'bombHint';
    hint.textContent = '💥 点击一行，清除整行方块并转化为得分 (ESC 取消)';
    gameEl.appendChild(hint);
  }

  function superBombRow(row) {
    let gain = 0;
    const toRemove = [];
    for (let c = 0; c < size; c++) {
      const tile = grid[row][c];
      if (tile && !tile.obstacle) {
        gain += tile.value;
        toRemove.push(tile);
      }
    }
    toRemove.forEach(t => {
      t.el.classList.add('cracking');
      spawnParticles(t.row, t.col, t.value, 6);
      grid[t.row][t.col] = null;
    });
    setTimeout(() => {
      toRemove.forEach(t => { t.el.remove(); tiles.delete(t.id); });
    }, 400);
    if (gain > 0) {
      updateScore(gain, true);
      flashMessage(`💥 超级炸弹: +${gain}分!`, '#ff6f00');
    }
    superBombUsed = true;
    superBombMode = false;
    exitBombMode();
    audio.beep(150, 0.4, 'sawtooth', 0.15);
    setTimeout(() => {
      if (!hasMoves()) {
        state = STATE.OVER;
        audio.over();
        showOverlay({
          title: '游戏结束',
          text: `5×5 · 共 ${moves} 步，得分 ${score}`,
          btn: '再来一局',
          onClick: () => startGame()
        });
      }
    }, 500);
  }

  function exitBombMode() {
    bombMode = false;
    superBombMode = false;
    gameEl.classList.remove('bomb-mode');
    const hint = document.getElementById('bombHint');
    if (hint) hint.remove();
  }

  function bombTile(tile) {
    if (!tile || tile.obstacle) return;
    // add cracking animation
    tile.el.classList.add('cracking');
    // spawn extra particles
    spawnParticles(tile.row, tile.col, tile.value, 8);
    audio.beep(120, 0.3, 'sawtooth', 0.12);
    setTimeout(() => {
      tile.el.remove();
      tiles.delete(tile.id);
      grid[tile.row][tile.col] = null;
      exitBombMode();
      // check game over
      if (!hasMoves()) {
        state = STATE.OVER;
        audio.over();
        showOverlay({
          title: '游戏结束',
          text: `5×5 · 共 ${moves} 步，得分 ${score}`,
          btn: '再来一局',
          onClick: () => startGame()
        });
      }
    }, 400);
  }

  // ===== Shop =====
  function renderShop() {
    const container = document.getElementById('shopItems');
    container.innerHTML = '';
    const shopCoinsEl = document.getElementById('shopCoins');
    if (shopCoinsEl) shopCoinsEl.textContent = coins;

    // curse removal option (only if in stage 4+ and has removable curse)
    if (canRemoveCurse()) {
      const div = document.createElement('div');
      div.className = 'shop-item curse-remove';
      div.innerHTML = `
        <div class="item-icon">🔓</div>
        <div class="item-info">
          <div class="item-name">解除诅咒</div>
          <div class="item-desc">花费20金币消除一个可解除的诅咒</div>
        </div>
        <div class="item-price">🪙 20</div>
      `;
      if (coins >= 20) div.onclick = () => shopRemoveCurse();
      else div.classList.add('disabled');
      container.appendChild(div);
    }

    Object.values(ITEMS).forEach(item => {
      let price = item.price;
      if (item.id === 'bomb') price = Math.ceil(price * bombDiscount);
      if (item.id === 'undo') price = Math.ceil(price * undoDiscount);
      const afford = coins >= price;
      // sweep requires >20 tiles on board
      const tileCount = [...tiles.values()].filter(t => !t.obstacle && !t.frozen).length;
      const sweepBlocked = item.id === 'sweep' && tileCount <= 20;
      const div = document.createElement('div');
      div.className = 'shop-item' + ((afford && !sweepBlocked) ? '' : ' disabled');
      div.innerHTML = `
        <div class="item-icon">${item.name.split(' ')[0]}</div>
        <div class="item-info">
          <div class="item-name">${item.name.split(' ')[1]}</div>
          <div class="item-desc">${item.desc}</div>
        </div>
        <div class="item-price">🪙 ${price}</div>
      `;
      if (afford && !sweepBlocked) {
        div.onclick = () => buyItem(item.id);
      }
      container.appendChild(div);
    });
  }

  function buyItem(itemId) {
    const item = ITEMS[itemId];
    if (!item) return;
    let price = item.price;
    if (itemId === 'bomb') price = Math.ceil(price * bombDiscount);
    if (itemId === 'undo') price = Math.ceil(price * undoDiscount);
    if (coins < price) return;
    updateCoins(-price);
    if (itemId === 'bomb') {
      enterBombMode();
    } else if (itemId === 'undo') {
      undo();
    } else if (itemId === 'crystal') {
      showCrystalBall();
    } else if (itemId === 'doubler') {
      nextCoinMult = 3;
      flashMessage('✨ 下次金币×3!', '#ffd54f');
    } else if (itemId === 'shield') {
      shieldCount++;
      flashMessage(`🛡️ 护盾已装备 (x${shieldCount})`, '#64b5f6');
    } else if (itemId === 'sweep') {
      sweepMinimals();
    }
    renderShop();
    saveGame();
  }

  function showCrystalBall() {
    const empties = [];
    for (let r = 0; r < size; r++)
      for (let c = 0; c < size; c++)
        if (!grid[r][c]) empties.push({ r, c });
    if (!empties.length) {
      flashMessage('没有空位', '#ef5350');
      updateCoins(3);
      renderShop();
      return;
    }
    const cell = empties[Math.floor(Math.random() * empties.length)];
    const hint = document.createElement('div');
    hint.className = 'crystal-hint';
    const s = step();
    const pad = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pad')) || 20;
    hint.style.left = (pad + cell.c * s) + 'px';
    hint.style.top = (pad + cell.r * s) + 'px';
    hint.style.width = 'calc(var(--cell) + var(--gap))';
    hint.style.height = 'calc(var(--cell) + var(--gap))';
    gameEl.appendChild(hint);
    setTimeout(() => hint.remove(), 3000);
    flashMessage('🔮 水晶球: 预测方块位置', '#ba68c8');
  }

  function sweepMinimals() {
    const numberTiles = [];
    tiles.forEach(t => { if (!t.obstacle && !t.frozen) numberTiles.push(t); });
    if (numberTiles.length <= 20) {
      flashMessage('场上方块不足20个,无法使用清扫', '#ef5350');
      updateCoins(10); // refund
      renderShop();
      return;
    }
    numberTiles.sort((a, b) => a.value - b.value);
    const toRemove = numberTiles.slice(0, 2);
    toRemove.forEach(t => {
      t.el.classList.add('cracking');
      spawnParticles(t.row, t.col, t.value, 4);
      setTimeout(() => { t.el.remove(); }, 400);
      grid[t.row][t.col] = null;
    });
    setTimeout(() => {
      toRemove.forEach(t => tiles.delete(t.id));
    }, 400);
    flashMessage(`🧹 清扫了 ${toRemove.length} 个方块`, '#26c6da');
    audio.beep(600, 0.15, 'sine', 0.08);
  }

  function autoCleanSmallest() {
    const numberTiles = [];
    tiles.forEach(t => { if (!t.obstacle && !t.frozen) numberTiles.push(t); });
    if (!numberTiles.length) return;
    numberTiles.sort((a, b) => a.value - b.value);
    const t = numberTiles[0];
    t.el.classList.add('cracking');
    spawnParticles(t.row, t.col, t.value, 3);
    setTimeout(() => { t.el.remove(); }, 400);
    grid[t.row][t.col] = null;
    setTimeout(() => tiles.delete(t.id), 400);
  }

  function flashMessage(text, color) {
    const el = document.createElement('div');
    el.className = 'combo-popup';
    if (color) el.style.color = color;
    el.textContent = text;
    gameEl.appendChild(el);
    void el.offsetWidth;
    el.classList.add('show');
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 400);
    }, 900);
  }

  function init() {
    grid = Array.from({ length: size }, () => Array(size).fill(null));
    tiles = new Map();
    idCounter = 0;
    score = 0;
    busy = false;
    won = false;
    winShown = false;
    best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0;
    moves = 0;
    coins = 0;
    activeCurses = [];
    activeChallenges = [];
    shieldCount = 0;
    nextCoinMult = 1;
    undoSnapshot = null;
    bombMode = false;
    // stage/strategy reset
    currentStage = 1;
    stageRewardClaimed = [false, false, false, false, false];
    activeStrategies = [];
    coinBonus = 1;
    scoreBonus = 1;
    bombDiscount = 1;
    undoDiscount = 1;
    centerSpawn = false;
    highSpawn = false;
    comboMasterMult = 1;
    autoClean = false;
    superBombAvail = false;
    superBombUsed = false;
    superBombMode = false;
    updateCoins(0);
    updateScore(0, false);
    movesEl.textContent = '0';
    overlay.classList.remove('show');
    exitBombMode();
    renderShop();
    renderCurseList();
    renderChallengeList();
    renderStageBar();
    addRandomTile();
    addRandomTile();
  }

  function valueClass(v) {
    if (v <= 2048) return 'v' + v;
    return 'vbig';
  }

  function sizeClass(v) {
    const len = String(v).length;
    if (len >= 6) return 's6';
    if (len === 5) return 's5';
    if (len === 4) return 's4';
    return '';
  }

  function setTilePos(tile) {
    const s = step();
    const pos = `translate(${tile.col * s}px, ${tile.row * s}px)`;
    tile.el.style.transform = pos;
    tile.el.style.setProperty('--pos', pos);
  }

  function createTile(row, col, value, opts = {}) {
    const id = ++idCounter;
    const el = document.createElement('div');
    el.className = 'tile ' + valueClass(value) + ' ' + sizeClass(value);
    el.textContent = value;
    const tile = {
      id, row, col, value, el,
      mergedThisTurn: false,
      pop: false,
      toRemove: false
    };
    el.dataset.id = id;
    setTilePos(tile);
    tileLayer.appendChild(el);
    tiles.set(id, tile);
    if (opts.new) {
      el.classList.add('new');
      setTimeout(() => el.classList.remove('new'), POP_MS);
    }
    return tile;
  }

  function addRandomTile() {
    const empties = [];
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (!grid[r][c]) empties.push({ r, c });
      }
    }
    if (!empties.length) return null;
    let cell;
    // 精准生成: spawn in center 2x2
    if (centerSpawn) {
      const mid = Math.floor(size / 2);
      const centerCells = empties.filter(e =>
        (e.r === mid - 1 || e.r === mid) && (e.c === mid - 1 || e.c === mid)
      );
      cell = centerCells.length
        ? centerCells[Math.floor(Math.random() * centerCells.length)]
        : empties[Math.floor(Math.random() * empties.length)];
    } else {
      cell = empties[Math.floor(Math.random() * empties.length)];
    }
    // 赢在起跑线: spawn 8 instead of 2/4
    const value = highSpawn ? 8 : (Math.random() < 0.9 ? 2 : 4);
    const tile = createTile(cell.r, cell.c, value, { new: true });
    grid[cell.r][cell.c] = tile;
    return tile;
  }

  function buildTraversals(vec) {
    const t = { x: [], y: [] };
    for (let i = 0; i < size; i++) { t.x.push(i); t.y.push(i); }
    if (vec.x === 1) t.x.reverse();
    if (vec.y === 1) t.y.reverse();
    return t;
  }

  function inBounds(p) {
    return p.x >= 0 && p.x < size && p.y >= 0 && p.y < size;
  }

  function findFarthest(pos, vec) {
    let prev;
    let cur = { x: pos.x, y: pos.y };
    do {
      prev = cur;
      cur = { x: prev.x + vec.x, y: prev.y + vec.y };
    } while (inBounds(cur) && grid[cur.y][cur.x] === null);
    // check if the blocking cell is an obstacle
    const blocking = inBounds(cur) ? grid[cur.y][cur.x] : null;
    if (blocking && blocking.obstacle) {
      // obstacle blocks movement, tile stops before it
      return { farthest: prev, next: null };
    }
    return { farthest: prev, next: inBounds(cur) ? cur : null };
  }

  function move(direction) {
    if (state !== STATE.PLAYING) return;
    if (busy) return;
    if (bombMode || superBombMode) return;   // block movement while in bomb mode
    const vec = VECTORS[direction];
    if (!vec) return;
    audio.resume();

    // save snapshot for undo before processing the move
    saveSnapshot();

    const trav = buildTraversals(vec);
    let moved = false;
    let gain = 0;
    let mergeCount = 0;
    let coinGained = 0;

    tiles.forEach(t => { t.mergedThisTurn = false; t.toRemove = false; t.pop = false; });

    trav.y.forEach(y => {
      trav.x.forEach(x => {
        const tile = grid[y][x];
        if (!tile || tile.obstacle) return;
        const { farthest, next } = findFarthest({ x, y }, vec);
        const nextTile = next ? grid[next.y][next.x] : null;

        if (nextTile && !nextTile.obstacle && nextTile.value === tile.value && !nextTile.mergedThisTurn) {
          // merge: tile slides onto nextTile, then is absorbed; nextTile pops with doubled value
          tile.col = next.x;
          tile.row = next.y;
          tile.toRemove = true;
          nextTile.value *= 2;
          nextTile.mergedThisTurn = true;
          nextTile.pop = true;
          grid[y][x] = null;
          gain += nextTile.value;
          mergeCount++;
          const cg = mergeCoinGain(nextTile.value);
          if (cg > 0) {
            coinGained += cg;
          }
          moved = true;
          if (nextTile.value === WIN_TILE[size] && !winShown) won = true;
        } else {
          if (farthest.x !== x || farthest.y !== y) {
            grid[y][x] = null;
            tile.col = farthest.x;
            tile.row = farthest.y;
            grid[farthest.y][farthest.x] = tile;
            moved = true;
          }
        }
      });
    });

    if (!moved) return;

    moves++;
    movesEl.textContent = moves;
    movesEl.classList.remove('bump');
    void movesEl.offsetWidth;
    movesEl.classList.add('bump');
    audio.move();

    busy = true;

    // Phase 1: animate movement (update transforms). For pop tiles, keep old text during slide.
    tiles.forEach(tile => {
      setTilePos(tile);
    });

    // Phase 2: after slide, finalize merges + spawn new tile + score + game-over check
    setTimeout(() => {
      // remove absorbed tiles
      const toDelete = [];
      tiles.forEach(tile => {
        if (tile.toRemove) {
          tile.el.remove();
          toDelete.push(tile.id);
        }
      });
      toDelete.forEach(id => tiles.delete(id));

      // pop merged tiles: update display + animation + fx (particles/sound/shake)
      let maxMerge = 0;
      tiles.forEach(tile => {
        if (tile.pop) {
          tile.el.textContent = tile.value;
          tile.el.className = 'tile ' + valueClass(tile.value) + ' ' + sizeClass(tile.value);
          // re-trigger pop animation
          tile.el.classList.remove('pop');
          void tile.el.offsetWidth; // force reflow
          tile.el.classList.add('pop');
          setTimeout(() => tile.el.classList.remove('pop'), POP_MS);
          spawnParticles(tile.row, tile.col, tile.value, mergeCount >= 3 ? mergeCount * 2 : 0);
          // coin popup on merge
          const cg = mergeCoinGain(tile.value);
          if (cg > 0) {
            let displayCg = cg;
            // apply curse coinMult (wealth)
            activeCurses.forEach(ac => {
              const c = CURSES[ac.id];
              if (c.coinMult) displayCg = Math.round(displayCg * c.coinMult);
            });
            // apply challenge coinMult (wealth challenge)
            activeChallenges.forEach(ac => {
              const ch = CHALLENGES[ac.id];
              if (ch.coinMult) displayCg = Math.round(displayCg * ch.coinMult);
            });
            if (nextCoinMult > 1) {
              displayCg = displayCg * nextCoinMult;
              nextCoinMult = 1;
            }
            // apply strategy coinBonus (invest)
            displayCg = Math.round(displayCg * coinBonus);
            coinGained += displayCg;
            showCoinPopup(tile.row, tile.col, displayCg);
            addChallengeProgress(tile.value);
          }
          // auto-clean strategy: remove smallest isolated tile on merge
          if (autoClean) autoCleanSmallest();
          if (tile.value > maxMerge) maxMerge = tile.value;
          tile.pop = false;
        }
      });
      // earn total coins for this move (coinGained already includes all multipliers)
      if (coinGained > 0) updateCoins(coinGained);
      // advance all curses by one move (permanent effects)
      advanceCurses();
      // advance challenge moves
      advanceChallengeMoves();
      if (maxMerge > 0) {
        audio.merge(maxMerge);
        if (maxMerge >= 128) shake(maxMerge >= 1024);
        if (maxMerge === WIN_TILE[size]) flash();
      }

      // score with strategy bonuses (no combo multiplier system, replaced by 连击大师)
      if (gain > 0) {
        let finalGain = gain;
        // 连击大师: ×1.5 on multi-merge in one slide
        if (mergeCount >= 2 && comboMasterMult > 1) {
          finalGain = Math.round(finalGain * comboMasterMult);
          showCombo(mergeCount, comboMasterMult);
          audio.combo(mergeCount);
        }
        // 与狼共舞: scoreBonus multiplier
        finalGain = Math.round(finalGain * scoreBonus);
        updateScore(finalGain, true);
      }

      // check stage progression
      checkStageProgress();

      // new tile
      addRandomTile();

      busy = false;
      saveGame();

      // win overlay (once): save run to leaderboard, rank by fewest moves
      if (won && !winShown) {
        winShown = true;
        const goal = WIN_TILE[size];
        const entry = { moves, score, ts: Date.now(), size };
        saveRankingEntry(entry);
        state = STATE.WON;
        audio.win();
        showOverlay({
          title: '通关 ' + goal + '!',
          text: `5×5 · 用 ${moves} 步达成，得分 ${score}`,
          btn: '继续游戏',
          onClick: () => { state = STATE.PLAYING; },
          showRank: true,
          highlightTs: entry.ts
        });
      }

      // game over
      if (!hasMoves()) {
        state = STATE.OVER;
        clearSave();
        audio.over();
        showOverlay({
          title: '游戏结束',
          text: `5×5 · 共 ${moves} 步，得分 ${score}`,
          btn: '再来一局',
          onClick: () => startGame()
        });
      }
    }, MOVE_MS);
  }

  function hasMoves() {
    for (let r = 0; r < size; r++)
      for (let c = 0; c < size; c++)
        if (!grid[r][c]) return true;
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const tile = grid[r][c];
        if (!tile || tile.obstacle) continue;
        const v = tile.value;
        if (c + 1 < size && grid[r][c + 1] && !grid[r][c + 1].obstacle && grid[r][c + 1].value === v) return true;
        if (r + 1 < size && grid[r + 1][c] && !grid[r + 1][c].obstacle && grid[r + 1][c].value === v) return true;
      }
    }
    return false;
  }

  function updateScore(gain, animate) {
    score += gain;
    if (score > best) {
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
    }
    scoreEl.textContent = score;
    bestEl.textContent = best;
    if (animate && gain > 0) {
      scoreEl.classList.remove('bump');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('bump');
      bestEl.classList.remove('bump');
      void bestEl.offsetWidth;
      bestEl.classList.add('bump');
    }
  }

  function showOverlay({ title, text, btn, onClick, showRank, highlightTs }) {
    overlayTitle.textContent = title;
    overlayText.textContent = text || '';
    overlayText.style.display = text ? 'block' : 'none';
    if (showRank) {
      renderRanking(highlightTs);
      rankingEl.style.display = 'flex';
    } else {
      rankingEl.style.display = 'none';
    }
    const btnEl = document.getElementById('overlayBtn');
    btnEl.textContent = btn;
    overlay.classList.add('show');
    btnEl.onclick = () => {
      overlay.classList.remove('show');
      if (onClick) onClick();
    };
  }

  // ===== Leaderboard (rank by fewest moves to reach 2048) =====
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function loadRanking() {
    try {
      const raw = localStorage.getItem(RANK_KEY);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }

  function saveRankingEntry(entry) {
    const list = loadRanking();
    list.push(entry);
    // fewer moves ranks higher; ties broken by higher score, then earlier time
    list.sort((a, b) => a.moves - b.moves || b.score - a.score || a.ts - b.ts);
    const trimmed = list.slice(0, MAX_RANK);
    try { localStorage.setItem(RANK_KEY, JSON.stringify(trimmed)); } catch (e) {}
    return trimmed;
  }

  function renderRanking(highlightTs) {
    const list = loadRanking();
    if (!list.length) {
      rankingEl.innerHTML = '<div class="rank-empty">还没有通关记录，加油！</div>';
      return;
    }
    rankingEl.innerHTML = list.map((e, i) => {
      const cls = (highlightTs && e.ts === highlightTs) ? 'rank-item cur' : 'rank-item';
      const d = new Date(e.ts);
      const dateStr = `${d.getMonth() + 1}/${d.getDate()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
      const sz = e.size || 4;
      return `<div class="${cls}">
        <span class="rk-no">${i + 1}</span>
        <span class="rk-moves">${sz}×${sz} · ${e.moves}步</span>
        <span class="rk-score">${e.score}分</span>
        <span class="rk-date">${dateStr}</span>
      </div>`;
    }).join('');
  }

  function newGame() {
    tiles.forEach(t => t.el.remove());
    tiles.clear();
    init();
  }

  // ===== Input =====
  const KEY_MAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };

  document.addEventListener('keydown', (e) => {
    audio.resume();
    if (e.key === 'Escape') {
      // ESC cancels panel first
      if (panelMask.classList.contains('show')) {
        closePanels();
        e.preventDefault();
        return;
      }
      // ESC cancels bomb/superbomb mode next
      if (bombMode || superBombMode) {
        exitBombMode();
        e.preventDefault();
        return;
      }
      // ignore pause toggle while a full-screen overlay/menu is open
      if (overlay.classList.contains('show') || mainMenu.classList.contains('show')) return;
      e.preventDefault();
      togglePause();
      return;
    }
    const dir = KEY_MAP[e.key];
    if (dir) {
      e.preventDefault();
      move(dir);
    }
  }, { passive: false });

  // swipe support
  let touchStart = null;

  gameEl.addEventListener('touchstart', (e) => {
    audio.resume();
    if (e.touches.length === 1) {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
  }, { passive: true });

  gameEl.addEventListener('touchmove', (e) => {
    // prevent page scroll while swiping the board
    if (touchStart) e.preventDefault();
  }, { passive: false });

  gameEl.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    const absX = Math.abs(dx);
    const absY = Math.abs(dy);
    if (Math.max(absX, absY) > 24) {
      if (absX > absY) move(dx > 0 ? 'right' : 'left');
      else move(dy > 0 ? 'down' : 'up');
    }
    touchStart = null;
  }, { passive: true });

  document.getElementById('newGame').addEventListener('click', startGame);
  document.getElementById('menuStart').addEventListener('click', startGame);
  document.getElementById('menuContinue').addEventListener('click', continueGame);
  document.getElementById('menuRank').addEventListener('click', () => {
    showOverlay({
      title: '步数排行榜',
      text: '合成目标方块用步越少排名越靠前（最多保留 10 条）',
      btn: '返回菜单',
      onClick: () => showMenu(),
      showRank: true
    });
  });
  document.getElementById('rankBtn').addEventListener('click', () => {
    // lock the run while browsing the board
    const wasPlaying = state === STATE.PLAYING;
    if (wasPlaying) state = STATE.PAUSED;
    showOverlay({
      title: '步数排行榜',
      text: '合成目标方块用步越少排名越靠前（最多保留 10 条）',
      btn: '继续游戏',
      onClick: () => { if (wasPlaying) state = STATE.PLAYING; },
      showRank: true
    });
  });

  // size-toggle buttons (both in menu and subbar)
  document.querySelectorAll('.size-toggle button').forEach(btn => {
    btn.addEventListener('click', () => setSize(parseInt(btn.dataset.size, 10)));
  });

  // ===== Panel open/close =====
  const panelMask = document.getElementById('panelMask');
  const shopPanel = document.getElementById('shopPanel');
  const cursePanel = document.getElementById('cursePanel');

  function openPanel(name) {
    panelMask.classList.add('show');
    if (name === 'shop') {
      shopPanel.style.display = 'flex';
      cursePanel.style.display = 'none';
      renderShop();
    } else if (name === 'curse') {
      cursePanel.style.display = 'flex';
      shopPanel.style.display = 'none';
      renderChallengeList();
    }
  }
  function closePanels() {
    panelMask.classList.remove('show');
  }
  document.getElementById('shopOpen').addEventListener('click', () => openPanel('shop'));
  document.getElementById('curseOpen').addEventListener('click', () => openPanel('curse'));
  panelMask.addEventListener('click', (e) => {
    if (e.target === panelMask) closePanels();
  });
  document.querySelectorAll('.panel-close').forEach(btn => {
    btn.addEventListener('click', () => closePanels());
  });

  // bomb mode: click on tiles to bomb
  tileLayer.addEventListener('click', (e) => {
    if (superBombMode) {
      const el = e.target.closest('.tile');
      if (!el) return;
      const id = parseInt(el.dataset.id || findTileIdByEl(el), 10);
      const tile = tiles.get(id);
      if (tile) {
        superBombRow(tile.row);
      }
      return;
    }
    if (!bombMode) return;
    const el = e.target.closest('.tile');
    if (!el) return;
    const id = parseInt(el.dataset.id || findTileIdByEl(el), 10);
    const tile = tiles.get(id);
    if (tile && !tile.obstacle) {
      bombTile(tile);
    }
  });

  function findTileIdByEl(el) {
    for (const [id, t] of tiles) {
      if (t.el === el) return id;
    }
    return null;
  }

  // ESC cancels bomb mode
  const origKeyDown = document.onkeydown;

  // recompute layout + fx canvas + tile transforms if viewport changed (e.g. on resize)
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => applySize(), 120);
  });

  // boot: apply layout, init board, show menu
  applySize();
  init();
  showMenu();
})();
</script>
</body>
